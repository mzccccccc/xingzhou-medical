[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "numpy>=2.5.3",
    "pydicom>=3.0.2",
    "simpleitk>=2.5.6",
    "torch>=2.14.1",
